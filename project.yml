name: SisuCards
options:
  bundleIdPrefix: com.linapps
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Personal: debug
  Release: release
fileGroups:
  - StoreKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 34
    MARKETING_VERSION: "1.1.0"
    DEVELOPMENT_TEAM: 2FN25VD7TR
    # Phone development plus the approved temporary iPad simulator validation.
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
      DEBUG_INFORMATION_FORMAT: dwarf
      ENABLE_PREVIEWS: NO
    Personal:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG SISUCARDS_PERSONAL"
      ONLY_ACTIVE_ARCH: YES
      DEBUG_INFORMATION_FORMAT: dwarf
      ENABLE_PREVIEWS: NO
targets:
  SisuCards:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
        excludes:
          - BundledArtwork
          - artworkBriefs.json
      - path: Resources/BundledArtwork/manifest.json
        buildPhase: resources
      - path: MediaDelivery/generated/assets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.linapps.ykiflashcards
        INFOPLIST_KEY_CFBundleDisplayName: 3000 Finnish Words
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Personal:
          # Preserve the identity and data of the installed personal copy.
          PRODUCT_BUNDLE_IDENTIFIER: com.finnishcards.SisuCards
          INFOPLIST_KEY_CFBundleDisplayName: Sisu Cards
          ASSETCATALOG_COMPILER_APPICON_NAME: PersonalIcon
          MARKETING_VERSION: 0.23.1
          CURRENT_PROJECT_VERSION: 26
  SisuCardsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: StoreKit/SisuCards.storekit
        buildPhase: resources
    dependencies:
      - target: SisuCards
  SisuCardsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
      - path: StoreKit/SisuCards.storekit
        buildPhase: resources
    dependencies:
      - target: SisuCards
schemes:
  3000 Finnish Words:
    build:
      targets:
        SisuCards: all
    test:
      targets:
        - SisuCardsTests
        - SisuCardsUITests
  3000 Finnish Words Local Purchases:
    build:
      targets:
        SisuCards: all
    run:
      config: Debug
      storeKitConfiguration: StoreKit/SisuCards.storekit
      environmentVariables:
        SISUCARDS_STOREKIT_TESTING: "1"
    test:
      targets:
        - SisuCardsTests
        - SisuCardsUITests
  3000 Finnish Words Personal:
    build:
      targets:
        SisuCards: all
    run:
      config: Personal
    test:
      config: Debug
      targets:
        - SisuCardsTests
        - SisuCardsUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
